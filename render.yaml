services:
  - type: web
    name: paddy-disease-detection-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'gunicorn --bind 0.0.0.0:${PORT:-5000} app:app'
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FRONTEND_URL
        value: '*'
